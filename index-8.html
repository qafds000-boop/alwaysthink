<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>週五私中特訓班 學習紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one working column — reminders strip, session picker, roster rows (cards on phones); summary as a scrollable table. */
:root {
  --bg: #F5F6F8; --surface: #FFFFFF; --surface-2: #EEF1F5; --line: #D9DEE5;
  --ink: #1F2A36; --muted: #667383; --navy: #1A2F41; --gold: #ECC74F; --gold-soft: #FBF4DC;
  --ok: #2E7D5B; --ok-soft: #E3F2EA; --warn: #A86A12; --warn-soft: #FCEFD8; --bad: #B23B2E; --bad-soft: #F9E3E0;
  --cn: #B5653A; --en: #2F7D8C; --ma: #1A2F41; --on-accent: #FFFFFF;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #E3E7EC;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171E; --surface: #18212B; --surface-2: #202B37; --line: #2E3B49;
  --ink: #E6EBF1; --muted: #93A1B1; --navy: #9DB8D3; --gold: #E2BC45; --gold-soft: #3A3220;
  --ok: #6CC79B; --ok-soft: #1B3328; --warn: #E7AE55; --warn-soft: #3A2C17; --bad: #F08A7E; --bad-soft: #3D211E;
  --cn: #E59A70; --en: #6FC0CE; --ma: #9DB8D3; --on-accent: #11171E; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #26313D; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171E; --surface: #18212B; --surface-2: #202B37; --line: #2E3B49;
  --ink: #E6EBF1; --muted: #93A1B1; --navy: #9DB8D3; --gold: #E2BC45; --gold-soft: #3A3220;
  --ok: #6CC79B; --ok-soft: #1B3328; --warn: #E7AE55; --warn-soft: #3A2C17; --bad: #F08A7E; --bad-soft: #3D211E;
  --cn: #E59A70; --en: #6FC0CE; --ma: #9DB8D3; --on-accent: #11171E; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #26313D; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 3px solid var(--gold); padding-bottom: 12px; }
h1 { margin: 0; font-size: 1.45rem; color: var(--navy); letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: .85rem; }
.tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--navy); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.alerts { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.alerts h2, .panel h2 { margin: 0; font-size: 1rem; color: var(--navy); }
.alert-list { display: flex; flex-wrap: wrap; gap: 8px; }
.alert { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: .85rem; border: 1px solid transparent; }
.alert b { font-weight: 700; }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert .act { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px; font: inherit; font-size: .75rem; padding: 1px 8px; cursor: pointer; }
.calm { color: var(--ok); font-size: .9rem; }

.sessbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.sess { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 6px 10px; font: inherit; font-size: .85rem; cursor: pointer; display: grid; justify-items: center; line-height: 1.25; min-width: 58px; }
.sess small { color: var(--muted); font-size: .7rem; }
.sess[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-accent); }
.sess[aria-pressed="true"] small { color: inherit; opacity: .8; }
.sess .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-top: 2px; }
.sess .dot.none { background: transparent; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.stats { display: flex; flex-wrap: wrap; gap: 14px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.bulk { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 8px; font: inherit; font-size: .8rem; padding: 4px 10px; cursor: pointer; }

.roster { display: grid; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1.35fr) minmax(0, 1.5fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.row.head { background: var(--surface-2); font-size: .75rem; color: var(--muted); letter-spacing: .05em; padding-block: 7px; }
.row:last-child { border-bottom: 0; }
.name { font-weight: 700; color: var(--navy); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: inherit; font-size: .78rem; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"].present, .seg button[aria-pressed="true"].ontime, .seg button[aria-pressed="true"].done { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); font-weight: 700; }
.seg button[aria-pressed="true"].late, .seg button[aria-pressed="true"].sick, .seg button[aria-pressed="true"].personal { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); font-weight: 700; }
.seg button[aria-pressed="true"].excused { background: var(--surface-2); color: var(--navy); border-color: var(--navy); font-weight: 700; }
.seg button[aria-pressed="true"].absent, .seg button[aria-pressed="true"].missing, .seg button[aria-pressed="true"].undone { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); font-weight: 700; }
.hw { display: grid; gap: 4px; }
.hwline { display: flex; align-items: center; gap: 6px; }
.tag { font-size: .72rem; font-weight: 700; width: 3.2em; flex: 0 0 auto; }
.tag.cn { color: var(--cn); } .tag.en { color: var(--en); } .tag.ma { color: var(--ma); }
.quiz { display: grid; gap: 6px; }
.qline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .8rem; }
.wrong { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); }
.wrong input, .qline input { width: 3.6em; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; text-align: right; }
.qline .of { color: var(--muted); }
.pill { font-size: .7rem; padding: 1px 7px; border-radius: 999px; font-weight: 700; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.note input { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: .85rem; }
.lbl { display: none; font-size: .7rem; color: var(--muted); letter-spacing: .05em; margin-bottom: 2px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--surface-2); color: var(--muted); font-size: .75rem; font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
td.num { text-align: center; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; }
.meter i { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.meter i.on { background: var(--warn); border-color: var(--warn); }
.meter i.over { background: var(--bad); border-color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.check { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); cursor: pointer; }
.gate { padding: 28px 20px; max-width: 360px; margin: 40px auto; width: 100%; }
.gate form { display: grid; gap: 10px; }
.gate h2 { margin: 0; color: var(--navy); }
.gate input { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
#app[hidden] { display: none !important; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }
.foot { color: var(--muted); font-size: .78rem; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .85rem; }

.todo { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
.todo .alert { font-size: .78rem; padding: 3px 8px; }
.todo input { width: 3.4em; padding: 1px 5px; border: 1px solid currentColor; border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; text-align: right; }
.report-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.report-top select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 14px 16px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: .75rem; color: var(--muted); }
.tile .v { font-size: 1.25rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: .75rem; color: var(--muted); font-weight: 500; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; padding: 0 16px 16px; }
.chart { border: 1px solid var(--line); border-radius: 10px; padding: 12px; position: relative; min-width: 0; }
.chart h3 { margin: 0 0 6px; font-size: .9rem; color: var(--navy); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart svg .gridl { stroke: var(--grid); stroke-width: 1; }
.chart svg .pass { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart svg .passlbl { fill: var(--bad); font-weight: 700; }
.chart svg .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart svg .pt { stroke: var(--surface); stroke-width: 2; }
.chart svg .hit { fill: transparent; cursor: pointer; }
.c-s1 { stroke: var(--s1); } .f-s1 { fill: var(--s1); } .b-s1 { background: var(--s1); }
.c-s2 { stroke: var(--s2); } .f-s2 { fill: var(--s2); } .b-s2 { background: var(--s2); }
.c-s3 { stroke: var(--s3); } .f-s3 { fill: var(--s3); } .b-s3 { background: var(--s3); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .75rem; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -120%); }
.nodata { color: var(--muted); font-size: .85rem; padding: 30px 0; text-align: center; }
@media (max-width: 860px) {
  .row.head { display: none; }
  .row { grid-template-columns: 1fr; gap: 8px; }
  .lbl { display: block; }
}
@media (prefers-reduced-motion: no-preference) { .seg button, .sess { transition: background .12s, color .12s, border-color .12s; } }
</style>
</head>
<body>


<div class="wrap">
  <section id="gate" class="panel gate" hidden>
    <form id="gate-form">
      <h2>週五私中特訓班　學習紀錄</h2>
      <p class="sub">請輸入老師密碼</p>
      <input id="gate-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="密碼">
      <button type="submit" class="bulk">進入</button>
      <p id="gate-msg" class="sub" style="color:var(--bad)"></p>
    </form>
  </section>
  <div id="app" style="display:contents">
  <header class="top">
    <div>
      <h1>週五私中特訓班　學習紀錄</h1>
      <div class="sub">金牌躍騰內壢校｜每週五 18:00–20:00｜點名、作業繳交、小考成績</div>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-class" role="tab" aria-selected="true">上課紀錄</button>
      <button id="tab-sum" role="tab" aria-selected="false">學生總覽</button>
      <button id="tab-rep" role="tab" aria-selected="false">學習報表</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="alerts" aria-live="polite">
    <h2>需要處理</h2>
    <div id="alerts" class="alert-list"><span class="calm">資料載入中…</span></div>
  </section>

  <div id="view-class">
    <nav class="sessbar" id="sessbar" aria-label="選擇上課日期"></nav>
    <section class="panel" style="margin-top:12px">
      <div class="panel-head">
        <h2 id="sess-title">第 1 堂</h2>
        <div class="stats" id="sess-stats"></div>
        <button class="bulk" id="all-present">全班出席</button>
      </div>
      <div class="roster" id="roster"></div>
    </section>
  </div>

  <div id="view-sum" hidden>
    <section class="panel">
      <div class="panel-head"><h2>學生總覽</h2><div class="stats">事假上限 1 堂（遲到 15 分以上累計 2 次折 1 堂、未請假缺席算 1 堂；缺席免計不算）｜病假上限 2 堂｜小考 40 分以上通過</div></div>
      <div class="tablewrap"><table id="sumtable"></table></div>
    </section>
  </div>

  <div id="view-rep" hidden>
    <section class="panel">
      <div class="report-top"><h2 style="margin:0;font-size:1rem;color:var(--navy)">學習報表</h2>
        <label for="rep-student" class="sub">學生</label><select id="rep-student"></select></div>
      <div class="tiles" id="rep-tiles"></div>
      <div class="charts">
        <div class="chart" id="chart-score"></div>
        <div class="chart" id="chart-wrong"></div>
      </div>
      <div class="tablewrap" style="border-top:1px solid var(--line)"><table id="rep-table"></table></div>
    </section>
  </div>

  <p class="foot"><span id="sync"></span>　作業紀錄：同一次繳交期限，任一科遲交或未交即記 1 次；第 1 次通知家長，累計第 2 次由主任與親子討論。小考未滿 40 分須重新複習，下次上課補考。</p>
  </div>
</div>

<script>
/* ===== 設定：把 Apps Script 部署後的網址貼在這裡 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwl-PgAc7ZFWfM4lXhqlXOorSsFjIvQilWWhZG6EbxfBTFxlM_T84yK1V9DEnh65n8O9Q/exec';

const SESS = [
  [1,'11/13','國文'],[2,'11/20','英文'],[3,'11/27','數學'],[4,'12/04','國文'],[5,'12/11','英文'],[6,'12/18','數學'],
  [7,'01/08','國文'],[8,'01/15','英文'],[9,'01/22','數學'],[10,'01/29','國文'],[11,'02/12','英文'],[12,'02/19','數學'],
  [13,'02/26','國文'],[14,'03/05','英文'],[15,'03/12','數學'],
].map(([n,d,main]) => ({ n, d, main, year: n <= 6 ? 2026 : 2027 }));
const ATT = [['present','出席'],['late','遲到15分以上'],['personal','事假'],['sick','病假'],['absent','未請假'],['excused','缺席免計']];
const HW = [['ontime','準時'],['late','遲交'],['missing','未交']];
const SUBJ = [['cn','國特','國文特訓本'],['en','英特','英文特訓閱讀本'],['ma','數學','數學難題特訓']];
const PASS = 40;

let students = [], recs = {}, current = pickToday(), loaded = { s: false, r: false }, readOnly = false;
let pendingRender = false, repSid = null;
const ATTL = Object.fromEntries([['present','出席'],['late','遲到'],['personal','事假'],['sick','病假'],['absent','未請假'],['excused','缺席免計']]);
const HWL = { ontime: '準時', late: '遲交', missing: '未交' };
function lineChart(box, title, series, { yMax, pass, unit, xs }) {
  box.replaceChildren(el('h3', { text: title }));
  const has = series.some(se => se.values.some(v => typeof v === 'number'));
  box.append(el('div', { class: 'legend' }, series.map(se => el('span', {}, el('i', { class: 'b-' + se.cls }), se.name))));
  if (!has) { box.append(el('div', { class: 'nodata', text: '還沒有資料，上課登記後會自動畫出來。' })); return; }
  const W = 560, H = 200, L = 34, R = 12, T = 10, B = 26, NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; };
  const svg = mk('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': title });
  const x = (i) => L + (xs.length === 1 ? 0 : i * (W - L - R) / (xs.length - 1));
  const y = (v) => T + (1 - v / yMax) * (H - T - B);
  const step = yMax <= 10 ? 2 : yMax <= 25 ? 5 : 10;
  for (let v = 0; v <= yMax; v += step) {
    svg.append(mk('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'gridl' }));
    const t = mk('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' }); t.textContent = v; svg.append(t);
  }
  xs.forEach((s, i) => { if (xs.length <= 8 || i % 2 === 0 || i === xs.length - 1) { const t = mk('text', { x: x(i), y: H - 8, 'text-anchor': 'middle' }); t.textContent = s.d; svg.append(t); } });
  if (pass != null) {
    svg.append(mk('line', { x1: L, x2: W - R, y1: y(pass), y2: y(pass), class: 'pass' }));
    const t = mk('text', { x: W - R, y: y(pass) - 5, 'text-anchor': 'end', class: 'passlbl' }); t.textContent = `通過 ${pass}`; svg.append(t);
  }
  const tip = el('div', { class: 'tip', hidden: true });
  for (const se of series) {
    let d = '', pen = false;
    se.values.forEach((v, i) => { if (typeof v === 'number') { d += (pen ? 'L' : 'M') + x(i) + ' ' + y(v) + ' '; pen = true; } else pen = false; });
    svg.append(mk('path', { d, class: 'ln c-' + se.cls }));
    se.values.forEach((v, i) => {
      if (typeof v !== 'number') return;
      svg.append(mk('circle', { cx: x(i), cy: y(v), r: 4.5, class: 'pt f-' + se.cls }));
      const hit = mk('circle', { cx: x(i), cy: y(v), r: 11, class: 'hit' });
      const show = () => { const bw = svg.getBoundingClientRect(), bb = box.getBoundingClientRect(); tip.textContent = `${xs[i].d}　${se.name} ${v}${unit}`; tip.style.left = (bw.left - bb.left + x(i) / W * bw.width) + 'px'; tip.style.top = (bw.top - bb.top + y(v) / H * bw.height) + 'px'; tip.hidden = false; };
      hit.addEventListener('mouseenter', show); hit.addEventListener('focus', show); hit.addEventListener('mouseleave', () => tip.hidden = true); hit.addEventListener('blur', () => tip.hidden = true);
      hit.setAttribute('tabindex', '0');
      svg.append(hit);
    });
  }
  box.append(svg, tip);
}

      el('td', {}, st.hwRecs.length ? el('span', { class: 'pill ' + (st.hwRecs.length >= 2 ? 'bad' : 'warn'), text: `${st.hwRecs.length} 次` }) : el('span', { class: 'pill ok', text: '0' }),
        st.hwRecs.length ? el('div', { class: 'foot', text: st.hwRecs.map(n => SESS[n - 1].d).join('、') }) : null),
      el('td', {}, el('div', { class: 'chips' }, SUBJ.map(([k, short]) => el('span', { class: 'wrong' }, el('span', { class: 'tag ' + k, text: short, style: 'width:auto' }), st.wrongN[k] ? String(st.wrong[k]) : '—')))),
      el('td', { class: 'num', text: st.count ? (st.total / st.count).toFixed(1) : '—' }),
      el('td', {}, st.pending.length ? el('div', { class: 'chips' }, st.pending.map(p => el('span', { class: 'pill warn', text: `${p.d} ${p.label}` }))) : '—'),
      el('td', {}, el('div', { class: 'chips' },
        el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: !!s.notified, disabled: readOnly, onchange: (e) => writeStudent(s.id, { notified: e.target.checked }) }), '已通知家長'),
        el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: !!s.talked, disabled: readOnly, onchange: (e) => writeStudent(s.id, { talked: e.target.checked }) }), '主任已約談'))),
    ));
  }
  t.append(body);
}

/* ---------- tabs & bulk ---------- */
function setTab(which) {
  for (const [t, v] of [['class','class'],['sum','sum'],['rep','rep']]) {
    $('tab-' + t).setAttribute('aria-selected', String(which === t)); $('view-' + v).hidden = which !== t;
  }
}
$('tab-rep').addEventListener('click', () => setTab('rep'));
$('rep-student').addEventListener('change', (e) => { repSid = e.target.value; renderReport(); });
$('tab-class').addEventListener('click', () => setTab('class'));
$('tab-sum').addEventListener('click', () => setTab('sum'));
$('all-present').addEventListener('click', () => {
  const patch = { records: {} };
  for (const s of students) if (!rec(current, s.id).att) patch.records[s.id] = { att: 'present' };
  if (Object.keys(patch.records).length) writeSession(current, patch);
});

/* ---------- boot ---------- */
async function refresh(silent) {
  if (pendingWrites || (document.activeElement && document.activeElement.matches && document.activeElement.matches('input'))) return;
  try { applyData(await api()); setSync('已同步 ' + new Date().toTimeString().slice(0, 5)); showBanner(''); }
  catch (e) {
    if (e.message === 'pin') { try { localStorage.removeItem('fri_pin'); } catch (x) {} pin = ''; showGate('密碼不正確，請再輸入一次。'); }
    else if (!silent) showBanner('讀不到紀錄資料，請確認網路後重新整理。');
  }
}
function showGate(msg) { $('gate').hidden = false; $('gate-msg').textContent = msg || ''; $('app').hidden = true; }
$('gate-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  pin = $('gate-pin').value.trim(); if (!pin) return;
  try { localStorage.setItem('fri_pin', pin); } catch (x) {}
  $('gate').hidden = true; $('app').hidden = false; await refresh();
});
render();
if (!API_URL || API_URL.includes('貼上')) { showBanner('尚未設定 API_URL：請把 Apps Script 部署網址貼到 index.html 最上方的 API_URL。'); loaded.s = true; render(); }
else if (!pin) showGate();
else refresh();
setInterval(() => { if (!document.hidden && pin) refresh(true); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && pin) refresh(true); });
</script>

</body>
